# Cross-platform CI for Hold My Brief.
#
# The point of this file is that the SAME suite runs on Windows and macOS. That
# matters because the app is a Tauri desktop app whose webview is different on
# every OS (WebView2/Chromium on Windows, WKWebView on macOS), and because the
# test harness used to be Windows-only: playwright.config.ts hardcoded
# channel 'msedge' and the smoke scripts hardcoded dist/Hold My Brief.exe.
#
# No secrets are used and nothing is published. Each job only builds and tests;
# the unsigned Windows installer is kept as a short-lived workflow artifact.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows (WebView2)
            # No `channel` override is needed on Windows: Edge is the WebView2
            # runtime and is always present on windows-latest.
          - os: macos-latest
            name: macOS (WKWebView)
    env:
      # Keep Rust and Node caches out of the repo and reproducible.
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        # playwright.config.ts prefers a branded Chrome/Edge and falls back to a
        # cached Chromium build; windows-latest has Edge, macOS must download
        # Chromium. --with-deps installs the OS libraries Playwright needs.
        if: runner.os == 'macOS'
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm test

      - name: Browser end-to-end tests
        run: npm run test:e2e

      - name: Text layout anchor check
        run: npm run test:layout

      - name: Rust unit tests (locked)
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      # tauri::generate_context! embeds `bundle.frontendDist` ("../dist") at compile
      # time, so any step that compiles the binary needs the frontend built first.
      - name: Build frontend assets
        run: npm run build

      - name: Release build (custom-protocol)
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --features custom-protocol --release

      # WebView2 honours a remote-debugging port, so on Windows the smoke scripts drive
      # the real release binary over CDP: embedded UI, CLI open, IPC, pin, lock, save,
      # raw-byte transport and clean close. The MSVC build links the WebView2 loader
      # statically, so the binary runs from the target directory.
      #
      # GitHub's Windows runners are elevated, and WebView2 Runtime 150+ ignores
      # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS for elevated hosts by design
      # (tauri-apps/wry#1782, MicrosoftEdge/WebView2Feedback#5645). HKLM policy is still
      # honoured, so the runner opens the same port through the per-executable policy.
      - name: Open WebView2 CDP for the smoke test (runner-only policy)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name 'hold-my-brief.exe' -Value '--remote-debugging-port=19126' -PropertyType String -Force | Out-Null

      - name: Native smoke test (WebView2)
        if: runner.os == 'Windows'
        env:
          HOLD_MY_BRIEF_BINARY: src-tauri/target/release/hold-my-brief.exe
        run: npm run test:native

      # The Windows deliverable: tauri.windows.conf.json narrows bundling to NSIS.
      - name: Bundle the Windows installer (NSIS)
        if: runner.os == 'Windows'
        run: npx tauri build --bundles nsis

      - name: Keep the Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hold-my-brief-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Bundle the macOS .app
        if: runner.os == 'macOS'
        run: npx tauri build --bundles app
