# TEMPORARY: diagnoses why WebView2 exposes no CDP port on windows-latest. Remove before merge.
name: Diagnose WebView2 CDP
on:
  push:
    branches: [fix/windows-release-followups]
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: npm ci
      - run: npm run build
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked --features custom-protocol --release
      - name: Launch and inspect
        shell: pwsh
        run: |
          $runtime = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          "WebView2 runtime: $($runtime.pv)"
          "Session: $([System.Diagnostics.Process]::GetCurrentProcess().SessionId)  Interactive: $([Environment]::UserInteractive)"
          Get-ChildItem 'HKLM:\SOFTWARE\Policies\Microsoft\Edge*' -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.Name; $_ | Get-ItemProperty | Out-String }
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=19126'
          $app = Start-Process -FilePath 'src-tauri/target/release/float-reader.exe' -ArgumentList "$PWD\README.md" -PassThru
          Start-Sleep 30
          "App exited: $($app.HasExited) code: $(if ($app.HasExited) { $app.ExitCode })"
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'webview|float' } | Select-Object ProcessId,ParentProcessId,Name,@{n='Cmd';e={$_.CommandLine.Substring(0, [Math]::Min(300, $_.CommandLine.Length))}} | Format-List | Out-String -Width 400
          netstat -ano | Select-String ':19126'
          try { (Invoke-WebRequest 'http://127.0.0.1:19126/json/version' -UseBasicParsing -TimeoutSec 5).Content } catch { "CDP request failed: $_" }
          Get-ChildItem "$env:LOCALAPPDATA\io.github.rvynp.floatreader" -ErrorAction SilentlyContinue | Select-Object Name,Length | Out-String
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save("$PWD\diag-screen.png")
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webview2-diag
          path: diag-screen.png
          retention-days: 3
